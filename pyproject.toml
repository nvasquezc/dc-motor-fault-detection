[project]
name = "observador-dc"
version = "0.1.0"
description = "Plataforma de adquisicion, identificacion y diagnostico para accionamientos DC en lazo cerrado"
readme = "README.md"
authors = [
    {name = "Ing. Nestor O. Vasquez C.", email = "n.vasquez@jitteringenieria.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["motor-dc", "kalman", "fault-detection", "stm32", "predictive-maintenance"]

dependencies = [
    "pyserial>=3.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "torch>=2.0",
    "shap>=0.44",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "jupyter>=1.0",
]

[project.scripts]
obs-barrido = "observador.ensayos:main_barrido"
obs-gui = "observador.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observador"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]